name: Patch text field width

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-text-field-width.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lower minimum text field width
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.jsx')
          text = app.read_text()
          old = '<input type="range" min="0.12" max="0.8" step="0.02" value={selectedText.width || DEFAULT_TEXT_FIELD.width} onChange={(e) => patchTextField(selectedText.id, { width: Number(e.target.value) })} />'
          new = '<input type="range" min="0.04" max="0.8" step="0.01" value={selectedText.width || DEFAULT_TEXT_FIELD.width} onChange={(e) => { const width = Number(e.target.value); patchTextField(selectedText.id, { width, x: Math.min(Number(selectedText.x || 0), 1 - width) }); }} />'
          if old not in text:
              raise SystemExit('Could not find text field width slider')
          app.write_text(text.replace(old, new, 1))
          Path('.github/workflows/patch-text-field-width.yml').unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "TideTracts Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx .github/workflows/patch-text-field-width.yml
          git commit -m "Allow very narrow text fields"
          git push origin HEAD:main